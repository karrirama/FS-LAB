<!DOCTYPE html>
<html>

<head>
<title>My Styled Webpage</title>

<style>

/* Body Styling */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #74ebd5, #acb6e5);
}

/* Header Styling */
header {
    background-color: darkblue;
    color: white;
    text-align: center;
    padding: 25px;
    text-shadow: 2px 2px 5px black;
}

header h1 {
    font-family: Georgia, serif;
    font-size: 40px;
}

/* Navigation Bar */
nav {
    background-color: black;
    padding: 15px;
    text-align: center;
}

/* Navigation Links */
nav a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    margin: 20px;
    padding: 5px;
}

/* Navigation Hover Effect */
nav a:hover {
    color: yellow;
    background-color: green;
    border-radius: 5px;
}

/* Card Container */
.container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 20px;
    margin: 30px;
}

/* Card Design */
.card {
    background-color: white;
    width: 250px;
    padding: 20px;
    border: 2px solid black;
    border-radius: 15px;
    box-shadow: 5px 5px 10px gray;
}

/* Card Heading */
.card h2 {
    color: darkblue;
    font-family: Georgia, serif;
    font-size: 25px;
}

/* Card Paragraph */
.card p {
    font-family: Arial;
    font-size: 16px;
}

/* Button Styling */
button {
    background-color: darkblue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
}

/* Button Hover Effect */
button:hover {
    background-color: red;
    cursor: pointer;
}

/* Footer Styling */
footer {
    background-color: black;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 30px;
}

</style>

</head>

<body>

<!-- Header -->
<header>
    <h1>My Styled Webpage</h1>
    <p>HTML5 and CSS Web Styling</p>
</header>


<!-- Navigation Bar -->
<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>


<!-- Three Content Cards -->
<div class="container">

    <div class="card">
        <h2>HTML5</h2>
        <p>HTML5 is used to create the structure of webpages.</p>
        <button>Read More</button>
    </div>


    <div class="card">
        <h2>CSS</h2>
        <p>CSS is used to design webpages with colors and effects.</p>
        <button>Explore</button>
    </div>


    <div class="card">
        <h2>JavaScript</h2>
        <p>JavaScript adds interaction and dynamic features.</p>
        <button>Learn</button>
    </div>

</div>


<!-- Footer -->
<footer>
    <p>© 2026 My Styled Webpage</p>
</footer>

</body>

</html>
