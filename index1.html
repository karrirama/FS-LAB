<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
</head>
<body>
    <h2>Java script Arrays and Functions</h2>
    <script>
        let marks=[75,80,48,56,65,70];
        function displayarray(arr){
            document.write("<h3>student marks are:</h3>");
            for(let i=0;i<arr.length;i++){
                document.write(arr[i]+"<br>");

            }
        }
        function calculatesum(arr){
            let sum=0;
            for(let i=0;i<arr.length;i++){
                sum=sum+arr[i];
            }
            return sum;
        }
        function calculateaverage(arr){
            let total=calculatesum(arr);
            for(let i=0;i<arr.length;i++){
                total=total/arr.length;

            }
            return total;
        }
        function findmax(arr){
            let max=arr[0];
            for(let i=0;i<arr.length;i++){
                if(arr[i]>max){
                    max=max=arr[i];
                }

            }
            return max;
        }
        
        displayarray(marks);
        document.write("<br>");
        document.write("<b>total marks:</b>"+calculatesum(marks));
        document.write("<br><br>");
        document.write("<b>average marks:</b>"+calculateaverage(marks));
        document.write("<br><br>");
        document.write("<b>highest marks:</b>"+findmax(marks));
        document.write("<hr>");
        document.write("<h3><u>Array Methods:</u></h3>");
        document.write("<b>Length : </b>" + marks.length+"<br>");
        marks.push(90);
        document.write("<b>after adding marks:</b>"+marks+"<br>");
        marks.pop(75);
        document.write("<b>after pop:</b>"+marks+"<br>");
        let newmarks=[40,30];
        let allmarks=marks.concat(newmarks);
        document.write("<b>after conact:</b>:"+allmarks+"<br>");
        let sortedmarks=allmarks.sort();
        document.write("<b>after sorting:</b>"+sortedmarks+"<br>");
        let reversedmarks=allmarks.reverse();
        document.write("<b>after reversing:</b>"+reversedmarks+"<br>");
        document.write("<b after unshiftoperation:</b>"+marks.unshift(20)+"<br>");
        document.write("<b after shifting:</b>"+marks.shift()+"<br>");
        document.write("<b indexing:</b>"+marks.indexOf(90));
        




    
        


    </script>
    
     

</body>
</html>
